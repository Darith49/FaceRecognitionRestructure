# ==============================================================================
# Attendance System Backend - Docker Compose Configuration
# Standalone Django REST API with SQLite Persistence
# ==============================================================================

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendance_backend
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - SQLITE_DB_PATH=/app/data/db.sqlite3
      - DEEPFACE_HOME=/app/.deepface
    volumes:
      # Persistent SQLite database storage (db.sqlite3 and WAL logs)
      - ./data:/app/data
      # Persistent uploaded media files (face images)
      - ./media:/app/media
      # Cache downloaded ArcFace & MTCNN face recognition model weights
      - deepface_cache:/app/.deepface
      # Optional: uncomment the line below to mount source code for live hot-reloading
      # - .:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  deepface_cache:
    name: attendance_deepface_cache
